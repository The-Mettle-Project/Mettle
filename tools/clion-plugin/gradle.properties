# Plugin coordinates
pluginVersion=0.1.0

# IDE to compile and run against.
#
# platformLocalPath wins when it is set: point it at an installed IDE and the
# build uses that instead of downloading one, e.g.
#   platformLocalPath=C:/Program Files/JetBrains/CLion 2026.1.4
# Leave it empty to download platformVersion from the JetBrains repository.
platformType=CL
platformVersion=2026.1.4
platformLocalPath=

# Compatibility range written into plugin.xml. untilBuild is left open.
pluginSinceBuild=251

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
