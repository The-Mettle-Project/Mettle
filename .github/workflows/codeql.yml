name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
  schedule:
    - cron: "35 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Before init on purpose. CodeQL analyzes what it sees compiled while
      # tracing, so building the backend after init would pull libmtlc's sources
      # into this repository's results -- a dependency's code, in duplicate with
      # libmtlc's own CodeQL run. Building it first leaves only our frontend in
      # the traced build.
      - name: Fetch and build libmtlc backend
        run: ./get-libmtlc.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp

      - name: Build compiler
        run: make -j"$(nproc)"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
