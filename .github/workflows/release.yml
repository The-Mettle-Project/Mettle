name: Release

# On a version tag (v*), build the compiler on each platform, run the suite as
# a gate, then package and attach two kinds of asset to the GitHub Release:
#   - the full toolchain (compiler + bundled stdlib/runtime), a Windows .zip and
#     a Linux .tar.gz, fetched by install.sh / install.ps1;
#   - the backend only (headers + static library), libmtlc-<tag>-<target>.{zip,
#     tar.gz}, fetched by get-libmtlc.sh / get-libmtlc.ps1.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/label for a manual package (no Release upload)"
        default: "manual"
        required: false

permissions:
  contents: write   # needed to create/attach the Release

jobs:
  package:
    name: Build & package (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Build + full suite (build.bat runs the gate); a tag must pass tests to ship.
      # METTLE_VERSION stamps the version into the binary (build.bat reads it);
      # on a tag push it is the tag, otherwise the manual-dispatch label.
      - name: Build and test
        shell: cmd
        # METTLE_NO_CODEVIEW avoids a MinGW gcc ICE in the CodeView emitter.
        env:
          METTLE_NO_CODEVIEW: "1"
          METTLE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
        run: build.bat gcc

      - name: Stage release bundle
        id: stage
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq 'development' -or $tag -eq 'main') {
            $tag = "${{ github.event.inputs.tag }}"
          }
          $out = "mettle-$tag-windows-x64"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item bin\mettle.exe "$out\"
          Copy-Item -Recurse bin\stdlib "$out\stdlib"
          Copy-Item -Recurse bin\runtime "$out\runtime"
          if (Test-Path bin\mettle-build.bat) { Copy-Item bin\mettle-build.bat "$out\" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "$out\" }
          if (Test-Path README.md) { Copy-Item README.md "$out\" }
          $zip = "$out.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force
          echo "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Packaged $zip"

      # The backend-only asset (headers + mtlc.lib) that get-libmtlc.ps1 fetches.
      - name: Stage libmtlc backend
        id: libmtlc
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq 'development' -or $tag -eq 'main') {
            $tag = "${{ github.event.inputs.tag }}"
          }
          .\tools\dist-libmtlc.ps1
          $zip = "libmtlc-$tag-windows-x64.zip"
          Compress-Archive -Path dist\libmtlc -DestinationPath $zip -Force
          echo "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Packaged $zip"

      # Build the GUI installer (Inno Setup) from the bundle build.bat produced.
      # ISCC ships on the windows-latest image; install it if the image changes.
      # The wizard theming (WizardBackColorDynamicDark and the other DynamicDark
      # directives, and PNG wizard images) needs Inno 6.7.0 or newer, so the
      # engine version is checked before the build rather than after it fails on
      # an unrecognized directive.
      - name: Build GUI installer
        id: installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq 'development' -or $tag -eq 'main') {
            $tag = "${{ github.event.inputs.tag }}"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }

          # ISCC carries no version resource; it reports the engine version when
          # it compiles, so probe with a throwaway script.
          function Get-IsccVersion($exe) {
            $probe = Join-Path $env:RUNNER_TEMP "isccprobe.iss"
            @"
          [Setup]
          AppName=Probe
          AppVersion=1.0
          DefaultDirName={autopf}\Probe
          OutputDir=$env:RUNNER_TEMP
          OutputBaseFilename=isccprobe
          [Files]
          "@ | Set-Content -Path $probe -Encoding utf8
            $out = & $exe $probe 2>&1 | Out-String
            if ($out -match 'Compiler engine version:\s*Inno Setup\s*([0-9][0-9.]*)') { return [version]$Matches[1] }
            return $null
          }

          $have = Get-IsccVersion $iscc
          if ($have -eq $null) { throw "could not determine the Inno Setup version of $iscc" }
          Write-Host "Inno Setup engine $have"
          if ($have -lt [version]'6.7.0') {
            Write-Host "engine is older than 6.7.0; upgrading"
            choco upgrade innosetup --no-progress -y --version=6.7.3
            $have = Get-IsccVersion $iscc
            Write-Host "Inno Setup engine now $have"
          }
          if ($have -lt [version]'6.7.0') {
            throw "installer/Mettle.iss needs Inno Setup 6.7.0 or newer for its wizard theming; runner has $have"
          }

          # Inno expects a numeric-ish AppVersion; strip a leading 'v'.
          $ver = $tag -replace '^v',''
          & $iscc "/DMyAppVersion=$ver" installer\Mettle.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "mettle-$tag-windows-x64-setup.exe"
          Copy-Item installer\out\Mettle-Setup.exe $setup -Force
          echo "setup=$setup" >> $env:GITHUB_OUTPUT
          Write-Host "Built $setup"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mettle-windows-x64
          path: |
            ${{ steps.stage.outputs.zip }}
            ${{ steps.libmtlc.outputs.zip }}
            ${{ steps.installer.outputs.setup }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.stage.outputs.zip }}
            ${{ steps.libmtlc.outputs.zip }}
            ${{ steps.installer.outputs.setup }}
          generate_release_notes: true

  package-linux:
    name: Build & package (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build compiler
        run: |
          tag="${{ github.ref_name }}"
          if [ -z "$tag" ] || [ "$tag" = "development" ] || [ "$tag" = "main" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          make -j"$(nproc)" EXTRA_CFLAGS="-DMETTLE_VERSION_RAW=$tag"

      - name: Native ELF backend tests
        run: bash tools/test-elf-native.sh

      # A tag ships only if the same suite that gates the Windows package
      # passes here too.
      - name: Full test suite
        shell: bash
        run: pwsh -NoProfile -File tests/run_tests.ps1 -CompilerPath ./bin/mettle

      - name: Stage release bundle
        id: stage
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [ -z "$tag" ] || [ "$tag" = "development" ] || [ "$tag" = "main" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          out="mettle-$tag-linux-x64"
          mkdir -p "$out/bin"
          cp bin/mettle "$out/bin/"
          cp -r bin/stdlib "$out/stdlib"
          cp -r bin/runtime "$out/runtime"
          if [ -f LICENSE ]; then
            cp LICENSE "$out/"
          fi
          if [ -f README.md ]; then
            cp README.md "$out/"
          fi
          tar="$out.tar.gz"
          tar -czf "$tar" "$out"
          echo "tar=$tar" >> "$GITHUB_OUTPUT"
          echo "Packaged $tar"

      # The backend-only asset (headers + libmtlc.a) that get-libmtlc.sh fetches.
      - name: Stage libmtlc backend
        id: libmtlc
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [ -z "$tag" ] || [ "$tag" = "development" ] || [ "$tag" = "main" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          make dist-libmtlc
          tar="libmtlc-$tag-linux-x64.tar.gz"
          tar -C dist -czf "$tar" libmtlc
          echo "tar=$tar" >> "$GITHUB_OUTPUT"
          echo "Packaged $tar"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.stage.outputs.tar }}
          path: |
            ${{ steps.stage.outputs.tar }}
            ${{ steps.libmtlc.outputs.tar }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.stage.outputs.tar }}
            ${{ steps.libmtlc.outputs.tar }}
          # Notes are generated once by the windows job; regenerating here would
          # append a duplicate auto-notes block to the release body.
          generate_release_notes: false
