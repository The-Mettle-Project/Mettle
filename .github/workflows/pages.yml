name: Deploy site to GitHub Pages

# Publishes site/ to GitHub Pages, with website/index.html and its media as the landing page.
# One-time setup: repo Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "website/index.html"
      - "website/media/**"
      - "tools/gen-site-reference.py"
      - "src/error/error_explain.c"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Lay the landing page over site/
        run: |
          mkdir -p _site/media
          cp -r site/. _site/
          cp website/index.html _site/index.html
          cp website/media/hero.jpg website/media/plate-dusk.jpg website/media/plate-force.jpg website/media/plate-cold.jpg website/media/canyon.mp4 website/media/canyon-poster.jpg website/media/og.jpg _site/media/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
