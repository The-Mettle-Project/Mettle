name: Deploy site to GitHub Pages

# Publishes website/pages/ to GitHub Pages, with website/index.html and its media as the landing page,
# and the package registry under registry/.
# One-time setup: repo Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - "website/pages/**"
      - "website/index.html"
      - "website/media/**"
      - "website/registry/**"
      - "website/registry.py"
      - "website/versions/**"
      - "website/versions.py"
      - "website/fonts/**"
      - "tools/gen-site-reference.py"
      - "src/error/error_explain.c"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Lay the landing page over website/pages/
        run: |
          mkdir -p _site/media
          cp -r website/pages/. _site/
          cp website/index.html _site/index.html
          cp website/media/hero.mp4 website/media/canyon.mp4 website/media/canyon-poster.jpg website/media/og.jpg _site/media/
      - name: Build the package registry
        run: python3 website/registry.py build --out _site/registry
      - name: Build the versions pages
        run: python3 website/versions.py --out _site/versions
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
